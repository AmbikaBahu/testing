<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f5"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-192.png"><title>Our Finances</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Arial;color:#243044;background:#f7f8f5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer} .app{max-width:960px;margin:auto;padding:22px 18px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:#788397}.top h1{margin:4px 0;font-size:28px}.muted{color:#798397}.month{border:1px solid #e4e9e8;border-radius:12px;background:white;padding:10px;color:#354256}.card{background:#fff;border:1px solid #e9ecea;border-radius:20px;padding:19px;box-shadow:0 3px 18px #25334b07;margin-bottom:15px}.hero{background:linear-gradient(125deg,#dcefe6,#e7edfc 70%,#fce6df);border:0;padding:24px}.hero .amount{font-size:39px;font-weight:800;margin:9px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mini{padding:17px}.mini strong{display:block;font-size:22px;margin-top:8px}.label{font-size:12px;color:#687789}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section h2{font-size:17px;margin:0}.pill{border-radius:100px;padding:6px 10px;background:#e6f4ed;color:#287557;font-size:12px;font-weight:700}.btn{border:0;border-radius:12px;padding:12px 16px;background:#4869b5;color:white;font-weight:700}.btn.secondary{background:#eff2f8;color:#3c527b}.btn.danger{background:#fce8e7;color:#a33e3e}.btn.small{padding:7px 10px;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#ffffffed;border-top:1px solid #e9ebeb;backdrop-filter:blur(12px);padding:9px 8px max(12px,env(safe-area-inset-bottom));z-index:5}.navin{display:flex;width:min(100%,650px);justify-content:space-around}.nav button{background:transparent;border:0;color:#8290a1;font-size:11px;padding:5px 12px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav button span{font-size:22px}.nav button.active{color:#4266b5;font-weight:800}.hidden{display:none!important}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{color:#8994a2;font-size:11px;font-weight:700}td,th{padding:12px 7px;border-bottom:1px solid #f0f2f2;white-space:nowrap}td:last-child,th:last-child{text-align:right;font-weight:750}.tablewrap{overflow-x:auto}.tag{background:#eef1fa;border-radius:7px;padding:5px 7px;color:#5269a3}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:750;color:#5e6d7b}.field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid #dfe5e8;border-radius:11px;padding:12px;color:#27354b;min-width:0}.field textarea{resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap}.barrow{display:flex;align-items:center;gap:10px;margin:12px 0}.barrow>span{width:105px;font-size:12px}.bar{height:11px;background:#eef0f3;border-radius:12px;flex:1;overflow:hidden}.fill{height:100%;background:#80b9a1;border-radius:12px}.barrow b{width:65px;text-align:right;font-size:12px}.notice{font-size:12px;color:#66778a;line-height:1.6}.empty{text-align:center;color:#8290a0;padding:28px 0}.switch{display:flex;gap:7px}.switch button{border:1px solid #e1e7e8;background:#fff;border-radius:9px;padding:7px 12px;color:#62738b}.switch button.selected{background:#e4ebfa;color:#375baa;border-color:#c8d7f6;font-weight:750}.insight{background:#f1f5fd;border-left:4px solid #89a8e8;padding:14px;border-radius:12px;margin:10px 0;font-size:13px}.subtle{font-size:12px;color:#728094}.listrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f1;gap:10px}.listrow:last-child{border:0}.click{cursor:pointer}.incomegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:430px){.app{padding:18px 13px 110px}.hero .amount{font-size:33px}.mini strong{font-size:19px}.card{padding:15px}.formgrid{gap:8px}.top h1{font-size:25px}}
</style></head><body><main class="app">
<header class="top"><div><div class="eyebrow">OUR FINANCES ✦</div><h1 id="pageTitle">Overview</h1><div class="muted" style="font-size:13px">A little clarity, every day</div></div><input class="month" id="month" type="month"></header>
<section id="home" class="page"></section><section id="expenses" class="page hidden"></section><section id="add" class="page hidden"></section><section id="insights" class="page hidden"></section><section id="settings" class="page hidden"></section>
</main><nav class="nav"><div class="navin" id="nav"></div></nav>
<script>
const K='our-finances-v1';const cats=['House Rent','House maintenance','Electricity Bill','Water Bill','Maid and cook fees','Dining out','Groceries','Liquor','Self Care/Hobbies','One time expense','Travel','Shopping','Commute','EMI'];
let state;try{state=JSON.parse(localStorage.getItem(K))||{transactions:[],incomes:{},settlements:[]}}catch{state={transactions:[],incomes:{},settlements:[]}};state.transactions||=[];state.incomes||={};state.settlements||=[];
let page='home',editId=null,metric='paid',filter='',search='',month=new Date().toISOString().slice(0,7);
const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random();
function save(){localStorage.setItem(K,JSON.stringify(state));render()}
function tx(){return state.transactions.filter(x=>x.date.slice(0,7)===month).sort((a,b)=>b.date.localeCompare(a.date))}
function income(){return state.incomes[month]||{Ambika:0,Abhinav:0}}
function totals(){let t=tx(),spent=t.reduce((s,x)=>s+x.amount,0),paid={Ambika:0,Abhinav:0},share={Ambika:0,Abhinav:0},balance=0;for(let x of t){paid[x.paid]+=x.amount;if(x.for==='Both'){let a=x.amount*x.ambikaPct/100;share.Ambika+=a;share.Abhinav+=x.amount-a;balance+=x.paid==='Ambika'?x.amount-a:-a}else{share[x.for]+=x.amount;if(x.for!==x.paid)balance+=x.paid==='Ambika'?x.amount:-x.amount}}let settled=state.settlements.filter(x=>x.month===month).reduce((s,x)=>s+(x.from==='Abhinav'?x.amount:-x.amount),0);return {spent,paid,share,balance:balance-settled,settled}}
function pct(a,b){return b?((a/b)*100).toFixed(1)+'%':'—'}
function navTo(p){page=p;editId=null;render();scrollTo(0,0)}
function render(){let pages=['home','expenses','add','insights','settings'];pages.forEach(p=>$(p).classList.toggle('hidden',p!==page));$('pageTitle').textContent=({home:'Overview',expenses:'Expenses',add:editId?'Edit expense':'Add expense',insights:'Insights',settings:'Settings'})[page];$('month').value=month;$('nav').innerHTML=[['home','⌂','Home'],['expenses','▤','Expenses'],['add','⊕','Add'],['insights','◫','Insights'],['settings','⚙','Settings']].map(([p,i,n])=>`<button class="${p===page?'active':''}" onclick="navTo('${p}')"><span>${i}</span>${n}</button>`).join('');if(page==='home')home();if(page==='expenses')expenses();if(page==='add')add();if(page==='insights')insights();if(page==='settings')settings()}
function recentTable(items,editable=false){return items.length?`<div class="tablewrap"><table><thead><tr><th>Category</th><th>Date</th><th>Paid by</th><th>For</th><th>Cost</th>${editable?'<th></th>':''}</tr></thead><tbody>${items.map(x=>`<tr class="${editable?'click':''}" ${editable?`onclick="edit('${x.id}')"`:''}><td>${esc(x.category)}</td><td>${esc(x.date.slice(5))}</td><td>${esc(x.paid)}</td><td><span class="tag">${esc(x.for)}</span></td><td>${money(x.amount)}</td>${editable?'<td>✎</td>':''}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">No expenses yet. Add your first one ✨</div>'}
function home(){let a=totals(),i=income(),inc=+i.Ambika + +i.Abhinav;let v=a[metric];$('home').innerHTML=`<div class="card hero"><div class="label">Total spent this month</div><div class="amount">${money(a.spent)}</div><div class="subtle">${pct(a.spent,inc)} of combined income ${inc?'':'· Set incomes in Settings'}</div></div><div class="section"><h2>Individual spending</h2><div class="switch"><button class="${metric==='paid'?'selected':''}" onclick="metric='paid';render()">Paid</button><button class="${metric==='share'?'selected':''}" onclick="metric='share';render()">Share</button></div></div><div class="grid"><div class="card mini"><div class="label">Ambika</div><strong>${money(v.Ambika)}</strong><div class="subtle">${pct(v.Ambika,i.Ambika)} of income</div></div><div class="card mini"><div class="label">Abhinav</div><strong>${money(v.Abhinav)}</strong><div class="subtle">${pct(v.Abhinav,i.Abhinav)} of income</div></div></div><div class="section"><h2>Monthly settlement</h2></div><div class="card"><div class="label">${Math.abs(a.balance)<.005?'All settled 🎉':a.balance>0?'Abhinav owes Ambika':'Ambika owes Abhinav'}</div><div style="font-size:26px;font-weight:800;margin:8px 0">${money(Math.abs(a.balance))}</div><button class="btn small secondary" onclick="navTo('settings')">Record settlement</button></div><div class="section"><h2>Recent expenses</h2><button class="btn small secondary" onclick="navTo('expenses')">View all</button></div><div class="card">${recentTable(tx().slice(0,5))}</div>`}
function expenses(){let rows=tx().filter(x=>(!filter||x.category===filter)&&[x.category,x.paid,x.for,x.note].join(' ').toLowerCase().includes(search.toLowerCase()));$('expenses').innerHTML=`<div class="card"><div class="formgrid"><div class="field"><label>Search</label><input id="search" placeholder="Category, person, notes" value="${esc(search)}"></div><div class="field"><label>Category</label><select id="filter"><option value="">All categories</option>${cats.map(c=>`<option ${filter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><div id="expenseTable">${recentTable(rows,true)}</div></div><div class="notice">Tap any row to edit or delete. Personal expenses paid by the other person also affect settlement.</div>`;$('search').oninput=e=>{search=e.target.value;expenseRows()};$('filter').onchange=e=>{filter=e.target.value;expenseRows()}}
function expenseRows(){let rows=tx().filter(x=>(!filter||x.category===filter)&&[x.category,x.paid,x.for,x.note].join(' ').toLowerCase().includes(search.toLowerCase()));$('expenseTable').innerHTML=recentTable(rows,true)}
function edit(id){editId=id;page='add';render()}
function add(){let x=state.transactions.find(x=>x.id===editId)||{amount:'',date:new Date().toLocaleDateString('en-CA'),category:'Groceries',paid:'Ambika',for:'Both',ambikaPct:50,note:''};$('add').innerHTML=`<div class="card"><form id="expenseForm"><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min=".01" step=".01" required value="${esc(x.amount)}" placeholder="0"></div><div class="formgrid"><div class="field"><label>Category</label><select name="category">${cats.map(c=>`<option ${x.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input name="date" type="date" required value="${esc(x.date)}"></div><div class="field"><label>Paid by</label><select name="paid">${['Ambika','Abhinav'].map(c=>`<option ${x.paid===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Expense for</label><select name="for" id="for">${['Both','Ambika','Abhinav'].map(c=>`<option ${x.for===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field full" id="splitField"><label>Ambika's share (%) · Abhinav gets the remainder</label><input name="ambikaPct" type="number" min="0" max="100" step=".01" value="${esc(x.ambikaPct)}"></div><div class="field full"><label>Notes (optional)</label><textarea name="note" rows="2" placeholder="What was this for?">${esc(x.note)}</textarea></div></div><div class="actions"><button class="btn" type="submit">${editId?'Save changes':'Add expense'}</button>${editId?'<button type="button" class="btn danger" id="deleteBtn">Delete</button>':''}<button type="button" class="btn secondary" onclick="navTo('expenses')">Cancel</button></div></form></div>`;const toggle=()=>$('splitField').classList.toggle('hidden',$('for').value!=='Both');$('for').onchange=toggle;toggle();$('expenseForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let obj={id:editId||uid(),amount:Number(d.amount),date:d.date,category:d.category,paid:d.paid,for:d.for,ambikaPct:d.for==='Both'?Number(d.ambikaPct):0,note:d.note||''};if(!Number.isFinite(obj.amount)||obj.amount<=0||!Number.isFinite(obj.ambikaPct)||obj.ambikaPct<0||obj.ambikaPct>100){alert('Check the amount and split percentage.');return}if(editId)state.transactions=state.transactions.map(t=>t.id===editId?obj:t);else state.transactions.push(obj);month=obj.date.slice(0,7);editId=null;page='home';save()};if(editId)$('deleteBtn').onclick=()=>{if(confirm('Delete this expense?')){state.transactions=state.transactions.filter(t=>t.id!==editId);editId=null;page='expenses';save()}}}
function insights(){let t=tx(),a=totals(),by={};for(let x of t)by[x.category]=(by[x.category]||0)+x.amount;let entries=Object.entries(by).sort((a,b)=>b[1]-a[1]),prev=new Date(month+'-01T12:00:00');prev.setMonth(prev.getMonth()-1);let pm=prev.toISOString().slice(0,7),prior=state.transactions.filter(x=>x.date.slice(0,7)===pm).reduce((s,x)=>s+x.amount,0);let messages=[];if(!t.length)messages.push('Add expenses to start seeing your spending patterns.');else{if(entries[0])messages.push(`${entries[0][0]} is your largest category at ${money(entries[0][1])} (${pct(entries[0][1],a.spent)} of spending).`);if(prior)messages.push(`Spending is ${a.spent>=prior?'up':'down'} ${Math.abs((a.spent/prior-1)*100).toFixed(1)}% compared with ${pm}. Compare complete months for a fairer trend.`);else messages.push('Once you have data for two months, you will see month-on-month comparisons.')}let months=Array.from({length:6},(_,j)=>{let d=new Date(month+'-01T12:00:00');d.setMonth(d.getMonth()-(5-j));let m=d.toISOString().slice(0,7);return {m,v:state.transactions.filter(x=>x.date.slice(0,7)===m).reduce((s,x)=>s+x.amount,0)}});let max=Math.max(1,...months.map(x=>x.v));$('insights').innerHTML=`<div class="section"><h2>Spending by category</h2></div><div class="card">${entries.length?entries.map(([c,v])=>`<div class="barrow"><span>${esc(c)}</span><div class="bar"><div class="fill" style="width:${v/a.spent*100}%"></div></div><b>${money(v)}</b></div>`).join(''):'<div class="empty">No data yet</div>'}</div><div class="section"><h2>Last 6 months</h2></div><div class="card">${months.map(x=>`<div class="barrow"><span>${x.m}</span><div class="bar"><div class="fill" style="width:${x.v/max*100}%;background:#a1a9e8"></div></div><b>${money(x.v)}</b></div>`).join('')}</div><div class="section"><h2>Smart insights ✨</h2></div>${messages.map(m=>`<div class="insight">${esc(m)}</div>`).join('')}<p class="notice">Insights are calculated on your device. No financial data is sent to an AI service.</p>`}
function settings(){let i=income(),a=totals();$('settings').innerHTML=`<div class="section"><h2>Monthly take-home income</h2></div><div class="card"><form id="incomeForm"><div class="incomegrid"><div class="field"><label>Ambika (₹)</label><input name="Ambika" type="number" min="0" step=".01" value="${i.Ambika||''}" placeholder="0"></div><div class="field"><label>Abhinav (₹)</label><input name="Abhinav" type="number" min="0" step=".01" value="${i.Abhinav||''}" placeholder="0"></div></div><button class="btn" type="submit">Save income for ${month}</button></form></div><div class="section"><h2>Monthly settlements</h2></div><div class="card"><div class="label">Outstanding balance for ${month}</div><h2>${money(Math.abs(a.balance))} ${a.balance>0?'· Abhinav owes Ambika':a.balance<0?'· Ambika owes Abhinav':'· Settled'}</h2><form id="settleForm"><div class="formgrid"><div class="field"><label>Paid by</label><select name="from"><option>Ambika</option><option>Abhinav</option></select></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min=".01" step=".01" required></div></div><button class="btn secondary" type="submit">Record settlement</button></form>${state.settlements.filter(x=>x.month===month).map(x=>`<div class="listrow"><span class="subtle">${esc(x.from)} paid ${money(x.amount)} · ${esc(x.date)}</span><button class="btn small danger" onclick="removeSettlement('${x.id}')">Undo</button></div>`).join('')}</div><div class="section"><h2>Your data</h2></div><div class="card"><div class="actions"><button class="btn secondary" onclick="exportCSV()">Export CSV</button><button class="btn secondary" onclick="exportBackup()">Backup JSON</button><label class="btn secondary" style="cursor:pointer">Restore JSON<input type="file" id="restoreFile" accept=".json,application/json" style="display:none"></label></div><p class="notice">CSV opens in Excel or Google Sheets. JSON preserves expenses, incomes and settlements for restoring the app. Keep backups in a safe location. All records are stored locally on this device; clearing site data can erase them.</p></div><div class="card"><b>About this app</b><p class="notice">Single-device, offline-first finance tracker. No account, cloud database, or subscription. Your device must be unlocked to access locally saved data. For privacy, don't share unencrypted backup files.</p></div>`;$('incomeForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state.incomes[month]={Ambika:Number(d.Ambika||0),Abhinav:Number(d.Abhinav||0)};save()};$('settleForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let amt=Number(d.amount);if(!(amt>0))return;state.settlements.push({id:uid(),month,from:d.from,amount:amt,date:new Date().toLocaleDateString('en-CA')});save()};$('restoreFile').onchange=restore}
function removeSettlement(id){if(confirm('Undo this settlement?')){state.settlements=state.settlements.filter(x=>x.id!==id);save()}}
function download(name,data,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportBackup(){download('our-finances-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:1,...state},null,2),'application/json')}
function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function exportCSV(){let rows=[['Type','Date','Month','Category','Paid by','For','Ambika share %','Amount INR','Notes']];for(let x of state.transactions)rows.push(['Expense',x.date,x.date.slice(0,7),x.category,x.paid,x.for,x.ambikaPct,x.amount,x.note]);for(let [m,i] of Object.entries(state.incomes))for(let name of ['Ambika','Abhinav'])rows.push(['Income',m+'-01',m,'Income',name,name,'',i[name]||0,'']);for(let x of state.settlements)rows.push(['Settlement',x.date,x.month,'Settlement',x.from,x.from==='Ambika'?'Abhinav':'Ambika','',x.amount,'']);download('our-finances-'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+csv(rows),'text/csv;charset=utf-8')}
async function restore(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.transactions)||!d.incomes||!Array.isArray(d.settlements))throw Error('Invalid backup structure');if(!confirm('Replace all current records with this backup?'))return;state={transactions:d.transactions,incomes:d.incomes,settlements:d.settlements};save();alert('Backup restored')}catch(err){alert('Could not restore: '+err.message)}}
$('month').onchange=e=>{month=e.target.value;render()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
